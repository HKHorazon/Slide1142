<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Engine Experience Workshop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f0535 0%, #000000 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #9333ea, #d8b4fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #a1a1aa;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: linear-gradient(90deg, #7e22ce, #9333ea);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(147, 51, 234, 0.6);
            background: linear-gradient(90deg, #9333ea, #a855f7);
        }

        .btn-alt {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }

        .btn-alt:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Game Engine Experience Workshop</h1>
        <p>Click the links below to download presentation slides or visit GDevelop website.</p>

        <div class="links">
            <a href="../PDF/Special/Game_Workshop_GDNewEN.pdf" class="btn" target="_blank">
                📄 Download Presentation Slides (PDF)
            </a>
            <a href="https://gdevelop.io/" class="btn btn-alt" target="_blank">
                🎮 Go to GDevelop Official Website
            </a>
        </div>
        <div class="footer" style="margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1.5rem;">
            <p style="font-size: 0.9rem; color: #a1a1aa; margin-bottom: 0.3rem;">Department of Multimedia and Game Design, Hungkuang University</p>
            <p style="font-size: 0.9rem; color: #a1a1aa;">Created by Shih-Ming Chang (張仕明製作)</p>
        </div>
    </div>
</body>

</html>
